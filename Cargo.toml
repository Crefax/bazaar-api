[package]
name = "bazaar-api"
version = "0.2.0"
edition = "2024"

[dependencies]
actix-web = "4.13"
mongodb = "3.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json"] }
futures = "0.3"
actix-cors = "0.7"
