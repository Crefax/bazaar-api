[package]
name = "bazaar-api"
version = "0.2.0"
edition = "2024"

[dependencies]
actix-web = "4.13"
mongodb = "3.7"
bson = { version = "2.15", features = ["chrono-0_4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = { version = "0.17", features = ["runtime-detection", "serde_impl"] }
tokio = { version = "1.52", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "gzip"] }
futures = "0.3"
actix-cors = "0.7"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.23", features = ["v4", "serde"] }
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
hmac = "0.12"
ipnet = "2.12"
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
